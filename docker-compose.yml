version: '3.8'

services:
  kys-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kys-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=kys_jwt_secret_production_key_change_in_prod
      - MONGODB_URI=mongodb://mongo:27017/kys
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: kys-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:

